<script>
// ================= UTILS =================
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=u=>{u=clamp(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
const easeOut=u=>1-Math.pow(1-clamp(u),3);
const backOut=u=>{u=clamp(u);const c=2.2;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2);};
function spring(a,w,z){ return a<=0?0:1-Math.exp(-z*a)*Math.cos(w*a); }
function hash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return (s-Math.floor(s))*2-1; }

// ================= DATA =================
const FPS=30; // END (clock end, 90+7 here) comes from data.js
// team themes: A = Man United red / deep-red stripes with a thin devil-gold trim line, E = Aston Villa sky-blue / claret stripes (sleeves and shirt) with a thin pale trim line.
// Single-colour uses (glow, rings) take TC; TC2 is the halo (United's gold, Villa's claret)
const COL_EB=new THREE.Color('#c8101e'), COL_EG=new THREE.Color('#6e0710');
const TC={A:'#ff2a2a',E:'#7cc0ff'}, TC2={A:'#ffb81c',E:'#c4296b'}, TC3={A:0xff2a2a,E:0x7cc0ff};
const RED='#ff2330', ICE='#dbe7ff';
// EVENTS, OTHER (every other shot) and MOM (attacking momentum) come from data.js: FotMob / Opta, not modelled
function smoothMom(sig){ const out=[]; for(let i=0;i<=END*4;i++){ const m=i/4; let a=0,w=0; for(const [mm,v] of MOM){ const k=Math.exp(-(mm-m)*(mm-m)/(2*sig*sig)); a+=v*k; w+=k; } out.push(a/w); } return out; }
const DOM_S=smoothMom(1.6), MOM_S=smoothMom(1.0);
function samp(arr,m){ const u=clamp(m,0,END)*4, i=Math.floor(u), f=u-i; return i>=arr.length-1?arr[arr.length-1]:arr[i]+(arr[i+1]-arr[i])*f; }
// dominance (+ = United on top) drives the territory front line on the surface
function dom(m){ return 0.9*samp(DOM_S,m); }
let seed2=99;function rnd2(){seed2=(seed2*16807)%2147483647;return (seed2-1)/2147483646;}
const SHOTS=EVENTS.map((e,i)=>({...e,ei:i})).filter(e=>e.x!==undefined); // var / red events have no shot location
OTHER.forEach(([m,team,xg,x,z,k])=>SHOTS.push({m,team,type:'shot',xg,x,z,k}));
SHOTS.sort((a,b)=>a.m-b.m);
const GOALS=EVENTS.filter(e=>e.type==='goal');

// ================= TIME MAP (clock holds on each event) =================
const RATE=1/0.19, CREEP=0.3, INTRO=3.4, IMPACT=0.33, FT_LEN=Math.round(6.4*FPS);
const isChance=e=>e.type==='miss'||e.type==='post'||e.type==='save';
const dwellT=EVENTS.map(e=>e.type==='goal'?1.8:(isChance(e)?1.4:1.5));
const HT_HOLD=1.4; // clock pauses on HT so the half-time xG read gets air
const mArr=[], htArr=[], trig=EVENTS.map(()=>-1); let FT_FRAME=0;
(function(){ let m=0,hold=0,cur=-1,next=0,f=0,ht=0,htDone=false; const L=EVENTS.length-1;
 while(true){ const t=f/FPS; let inHT=false;
  if(t<INTRO){}
  else if(hold>0){ m+=CREEP/dwellT[cur]/FPS; hold-=1/FPS; if(hold<=0)cur=-1; }
  else if(ht>0){ ht-=1/FPS; inHT=true; }
  else if(m<END){ m=Math.min(END,m+RATE/FPS);
    if(!htDone&&m>=45.9){ m=45.9; ht=HT_HOLD; htDone=true; inHT=true; }
    else if(next<EVENTS.length&&m>=EVENTS[next].m){ m=EVENTS[next].m; cur=next; trig[next]=t; hold=dwellT[next]; next++; } }
  else if(!FT_FRAME&&t>=trig[L]+dwellT[L]+0.5) FT_FRAME=f;
  mArr.push(m); htArr.push(inHT); f++; if(FT_FRAME&&f>=FT_FRAME+FT_LEN) break; } })();
const TOTAL=mArr.length;
function tOfMinute(mm){ for(let f=0;f<TOTAL;f++) if(f/FPS>=INTRO&&mArr[f]>=mm) return f/FPS; return 1e9; }
SHOTS.forEach(s=>{ s.t=s.type==='shot'?tOfMinute(s.m):trig[s.ei]; s.ti=s.type==='shot'?s.t:s.t+IMPACT; });

// ================= SURFACE MODEL =================
const W=105,H=68,SX=150,SZ=96,K=70;
function nz(a,b){return Math.sin(a*1.7+Math.sin(b*1.3))*Math.cos(b*1.1-Math.sin(a*.9));}
function boundary(z,m){ return dom(m)*46 + 7*Math.sin(z*.13+m*.12) + 3*Math.sin(z*.31-m*.2); }
const CUR={m:0,t:0,k:0,vib:0,vph:0};
let SP=[], RIP=[], SURGE=[], HA=0, HE=0, WV=0;
const HT_T=(()=>{ for(let f=0;f<TOTAL;f++) if(htArr[f]) return f/FPS; return 1e9; })(), KO2_T=HT_T+HT_HOLD;

function buildFX(f){ const t=f/FPS, k=CUR.k, ftU=f>=FT_FRAME?(f-FT_FRAME)/FPS:-1;
  SP=[]; RIP=[]; SURGE=[]; let vib=0, vph=0;
  // centre-spot pulses: kick-off, half-time whistle, second-half kick-off
